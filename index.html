<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zephyr Lite AI - Minimalist Web Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body class="bg-[#0f0f11] text-gray-200 h-screen flex flex-col font-sans antialiased overflow-hidden">

    <!-- Top Header & Settings Bar -->
    <header class="border-b border-gray-800 bg-[#16161a] px-4 py-3 flex flex-wrap justify-between items-center gap-2">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse" id="status-indicator"></div>
            <span class="font-bold text-lg text-white tracking-wide">Zephyr Lite</span>
            <span class="text-xs px-2 py-0.5 rounded bg-gray-800 text-gray-400 border border-gray-700" id="status-text">Sunucu Kontrol Ediliyor...</span>
        </div>

        <div class="flex items-center space-x-2 text-sm w-full sm:w-auto">
            <label for="server-url" class="text-gray-400 whitespace-nowrap hidden sm:inline">Sunucu URL:</label>
            <input type="text" id="server-url" value="http://localhost:8000" class="bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-xs sm:text-sm text-gray-200 focus:outline-none focus:border-indigo-500 w-full sm:w-64" placeholder="http://localhost:8000" />
            <button onclick="checkConnection()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 px-3 py-1.5 rounded text-xs whitespace-nowrap transition-colors">
                Test Et
            </button>
        </div>
    </header>

    <!-- Main Chat Window -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl mx-auto w-full">
        <!-- System Welcome Message -->
        <div class="flex flex-col space-y-1 max-w-[85%] sm:max-w-[75%] mr-auto">
            <div class="text-xs text-gray-500 font-medium ml-1">Zephyr Lite</div>
            <div class="bg-[#1e1e24] border border-gray-800 p-3.5 rounded-2xl rounded-tl-none text-gray-200 text-sm leading-relaxed shadow-sm">
                Hello. I am Zephyr.
            </div>
        </div>
    </main>

    <!-- Message Input Bar -->
    <footer class="border-t border-gray-800 bg-[#16161a] p-3 md:p-4">
        <div class="max-w-4xl mx-auto flex items-end space-x-2">
            <div class="flex-1 bg-gray-900 border border-gray-700 rounded-xl focus-within:border-indigo-500 transition-colors">
                <textarea 
                    id="user-input" 
                    rows="1" 
                    placeholder="Zephyr Lite'a bir mesaj gönderin..." 
                    class="w-full bg-transparent p-3 text-sm text-gray-100 placeholder-gray-500 resize-none focus:outline-none max-h-32"
                    onkeydown="handleKeyPress(event)"
                    oninput="autoResize(this)"></textarea>
            </div>
            <button 
                id="send-btn" 
                onclick="sendMessage()" 
                class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white p-3 rounded-xl transition-all focus:outline-none">
                <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
            </button>
        </div>
        <div class="text-center text-[10px] text-gray-600 mt-2">
            Zephyr Lite Engine (TinyLlama 1.1B) - Yerel Ağ Bağlantısı
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const serverUrlInput = document.getElementById('server-url');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        let isGenerating = false;

        function autoResize(element) {
            element.style.height = 'auto';
            element.style.height = (element.scrollHeight) + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function checkConnection() {
            const baseUrl = serverUrlInput.value.replace(/\/$/, "");
            statusIndicator.className = "w-3 h-3 rounded-full bg-yellow-500 animate-pulse";
            statusText.innerText = "Kontrol Ediliyor...";

            try {
                const response = await fetch(`${baseUrl}/health`, { method: 'GET' });
                if (response.ok) {
                    statusIndicator.className = "w-3 h-3 rounded-full bg-emerald-500";
                    statusText.innerText = "Bağlandı (Aktif)";
                } else {
                    throw new Error("Sunucu yanıt vermedi");
                }
            } catch (err) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-rose-500";
                statusText.innerText = "Bağlantı Hatası";
            }
        }

        async function sendMessage() {
            if (isGenerating) return;

            const text = userInput.value.trim();
            if (!text) return;

            const baseUrl = serverUrlInput.value.replace(/\/$/, "");

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            const loadingId = appendLoading();
            setGeneratingState(true);

            try {
                const response = await fetch(`${baseUrl}/api/v1/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: text,
                        max_tokens: 256,
                        temperature: 0.7,
                        top_p: 0.9
                    })
                });

                removeLoading(loadingId);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `Sunucu hatası: ${response.status}`);
                }

                const data = await response.json();
                appendMessage('assistant', data.response || 'Boş yanıt döndü.');

            } catch (error) {
                removeLoading(loadingId);
                appendMessage('system', `Hata: ${error.message}. Lütfen sunucu IP adresini ve Zephyr Lite servisinin açık olduğunu kontrol edin.`);
            } finally {
                setGeneratingState(false);
            }
        }

        function setGeneratingState(generating) {
            isGenerating = generating;
            sendBtn.disabled = generating;
        }

        function appendMessage(role, content) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex flex-col space-y-1 max-w-[85%] sm:max-w-[75%] ${role === 'user' ? 'ml-auto items-end' : 'mr-auto items-start'}`;

            const roleLabel = document.createElement('div');
            roleLabel.className = 'text-xs text-gray-500 font-medium px-1';
            roleLabel.innerText = role === 'user' ? 'Siz' : (role === 'system' ? 'Sistem' : 'Zephyr Lite');

            const bubble = document.createElement('div');
            if (role === 'user') {
                bubble.className = 'bg-indigo-600 text-white p-3.5 rounded-2xl rounded-tr-none text-sm leading-relaxed shadow-sm whitespace-pre-wrap';
            } else if (role === 'system') {
                bubble.className = 'bg-rose-950/40 border border-rose-800/60 text-rose-300 p-3.5 rounded-2xl text-sm leading-relaxed shadow-sm';
            } else {
                bubble.className = 'bg-[#1e1e24] border border-gray-800 text-gray-200 p-3.5 rounded-2xl rounded-tl-none text-sm leading-relaxed shadow-sm whitespace-pre-wrap';
            }

            bubble.innerText = content;

            messageWrapper.appendChild(roleLabel);
            messageWrapper.appendChild(bubble);
            chatContainer.appendChild(messageWrapper);

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const messageWrapper = document.createElement('div');
            messageWrapper.id = id;
            messageWrapper.className = 'flex flex-col space-y-1 max-w-[85%] sm:max-w-[75%] mr-auto items-start';

            const roleLabel = document.createElement('div');
            roleLabel.className = 'text-xs text-gray-500 font-medium px-1';
            roleLabel.innerText = 'Zephyr Lite';

            const bubble = document.createElement('div');
            bubble.className = 'bg-[#1e1e24] border border-gray-800 text-gray-400 p-3.5 rounded-2xl rounded-tl-none text-sm flex items-center space-x-2';
            bubble.innerHTML = `
                <span>Zephyr Lite yanıt oluşturuyor</span>
                <span class="flex space-x-1">
                    <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                    <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                    <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                </span>
            `;

            messageWrapper.appendChild(roleLabel);
            messageWrapper.appendChild(bubble);
            chatContainer.appendChild(messageWrapper);

            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        window.onload = () => {
            checkConnection();
        };
    </script>
</body>
</html>
